<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Viewer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/presentation.css">
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/presentation/bootstrap.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="presentationApp()" x-init="init()" :class="{ 'mobile-device': isMobile }">
    <div id="presentationContainer">
        <!-- Desktop Slide Display (x-if avoids duplicating slide image loads vs mobile) -->
        <template x-if="!isMobile">
        <div id="slideDisplay" @click="handleSlideClick"
             @mousemove="onLaserPointerMove($event)"
             @touchmove.prevent="onLaserTouchMove($event)">
            <div x-show="showSlideStack && !slideError" class="slide-image-stack">
                <img class="slide-layer" :class="{ 'slide-layer-visible': slideActiveLayer === 0 }"
                    :src="slideLayerUrl0" :alt="`Slide ${displaySlideNumber}`"
                    @load="slideError = false; onSlideLayerLoad(0)" @error="handleSlideLayerError">
                <img class="slide-layer" :class="{ 'slide-layer-visible': slideActiveLayer === 1 }"
                    :src="slideLayerUrl1" :alt="`Slide ${displaySlideNumber}`"
                    @load="slideError = false; onSlideLayerLoad(1)" @error="handleSlideLayerError">
            </div>

            <!-- Error display for failed slides -->
            <div x-show="slideError" class="slide-error">
                <div class="error-icon">[!]</div>
                <div class="error-message">Failed to load slide <span
                        x-text="displaySlideNumber"></span>
                </div>
                <div class="error-details">The slide image could not be loaded</div>
                <div class="error-url" x-text="currentSlideImage"></div>
            </div>

            <canvas x-ref="laserTrailCanvas" class="laser-trail-canvas"></canvas>
            <canvas x-ref="drawingCanvas" class="drawing-canvas" :class="{ 
                    'drawing-mode': drawing.isDrawingMode,
                    'eraser-mode': drawing.currentTool === 'eraser'
                }"></canvas>
        </div>
        </template>

        <!-- Desktop UI Elements -->
        <div x-show="!isMobile" id="slideCounter">
            <span x-text="displaySlideNumber">1</span> /
            <span x-text="totalSlides">1</span>
        </div>

        <div x-show="!isMobile && isObserver" id="observerBadge">
            <span>Observing</span>
            <button type="button" id="presenterLoginBtn"
                    @click="$refs.presenterTokenInput.style.display = $refs.presenterTokenInput.style.display === 'none' ? 'flex' : 'none'; $nextTick(() => $refs.presenterTokenField.focus())">
                presenter?
            </button>
            <div x-ref="presenterTokenInput" id="presenterTokenInput" style="display:none">
                <input x-ref="presenterTokenField" type="text" placeholder="paste token"
                       @keydown.enter="window.location.href = window.location.pathname + '?token=' + $event.target.value.trim()"
                       @keydown.escape="$refs.presenterTokenInput.style.display = 'none'">
                <button type="button"
                        @click="window.location.href = window.location.pathname + '?token=' + $refs.presenterTokenField.value.trim()">
                    Go
                </button>
            </div>
        </div>

        <div x-show="!isMobile" id="connectionStatus">
            <span id="statusIndicator" :class="{ 'disconnected': !isConnected }">*</span>
            <span x-text="isConnected ? 'Connected' : 'Disconnected'">Connected</span>
            <span x-text="clientCount" class="client-count">1</span>
        </div>

        <div x-show="!isMobile && hintsVisible && !isObserver" id="navigationHints" :class="{ 'show': hintsVisible }">
            Left/Right - Space - PgUp/PgDn - Click - F for fullscreen
        </div>

        <!-- Desktop Drawing Toolbar -->
        <div x-show="!isMobile && !isObserver" id="drawingToolbar" class="drawing-toolbar" :class="{ 'drawing-active': drawing.isDrawingMode }">
            <button type="button" class="toolbar-btn toggle-btn"
                    :class="{ active: drawing.isDrawingMode }"
                    @click="drawing.isDrawingMode = !drawing.isDrawingMode; if (!drawing.isDrawingMode) { drawing.isDrawing = false; }"
                    title="Toggle annotations">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
            </button>

            <template x-if="drawing.isDrawingMode">
                <div style="display:contents">
                    <div class="toolbar-separator"></div>

                    <button type="button" class="toolbar-btn"
                            :class="{ active: drawing.currentTool === 'pen' }"
                            @click="drawing.currentTool = 'pen'"
                            title="Pen">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                    </button>

                    <button type="button" class="toolbar-btn"
                            :class="{ active: drawing.currentTool === 'eraser' }"
                            @click="drawing.currentTool = 'eraser'"
                            title="Eraser">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 0 1-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0M4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53l-4.95-4.95l-4.95 4.95z"/>
                        </svg>
                    </button>

                    <div class="toolbar-separator"></div>

                    <div class="color-picker-container">
                        <input type="color" class="color-picker"
                               :value="drawing.currentColor"
                               @input="drawing.currentColor = $event.target.value"
                               title="Color">
                        <div class="color-presets">
                            <template x-for="preset in drawing.colorPresets" :key="preset">
                                <div class="color-preset"
                                     :style="{ background: preset }"
                                     @click="drawing.currentColor = preset; drawing.currentTool = 'pen'"></div>
                            </template>
                        </div>
                    </div>

                    <div class="brush-size-container">
                        <span class="brush-size-label">Size</span>
                        <input type="range" class="brush-size-slider" min="1" max="20"
                               :value="drawing.currentWidth"
                               @input="drawing.currentWidth = Number($event.target.value)">
                        <span class="brush-size-value" x-text="drawing.currentWidth"></span>
                    </div>

                    <div class="toolbar-separator"></div>

                    <button type="button" class="toolbar-btn clear-btn"
                            @click="clearDrawings()"
                            title="Clear annotations on this slide">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
            </template>
        </div>

        <!-- Mobile Controller Interface -->
        <template x-if="isMobile">
        <div id="mobileController" class="mobile-only">
            <div class="mobile-header">
                <div x-text="presentationData?.title || 'Presentation'" class="presentation-title"></div>
                <div class="slide-info">
                    <span x-text="displaySlideNumber">1</span>
                    / <span x-text="totalSlides">1</span>
                </div>
            </div>

            <div class="mobile-slide-preview" @touchstart="handleMobileTouchStart" @touchend="handleMobileTouchEnd"
                @touchmove.prevent="onLaserTouchMove($event)"
                :class="{
                    'interaction-lock': isLaserActive || drawing.isDrawingMode,
                    'mobile-drawing-active': drawing.isDrawingMode
                }">
                <div class="mobile-slide-media">
                    <div x-show="showSlideStack" class="slide-image-stack slide-image-stack--mobile">
                        <img class="slide-layer" :class="{ 'slide-layer-visible': slideActiveLayer === 0 }"
                            :src="slideLayerUrl0" :alt="`Slide ${displaySlideNumber}`"
                            @load="slideError = false; onSlideLayerLoad(0)" @error="handleSlideLayerError">
                        <img class="slide-layer" :class="{ 'slide-layer-visible': slideActiveLayer === 1 }"
                            :src="slideLayerUrl1" :alt="`Slide ${displaySlideNumber}`"
                            @load="slideError = false; onSlideLayerLoad(1)" @error="handleSlideLayerError">
                    </div>
                    <canvas x-ref="mobileLaserTrailCanvas" class="laser-trail-canvas mobile-laser-trail"></canvas>
                    <canvas x-ref="mobileDrawingCanvas" class="mobile-drawing-canvas" :class="{ 
                        'drawing-mode': drawing.isDrawingMode,
                        'eraser-mode': drawing.currentTool === 'eraser'
                    }"></canvas>
                </div>
            </div>

            <div x-show="isObserver" class="mobile-observer-badge">Observing</div>

            <div x-show="!isObserver" class="mobile-tool-strip" role="toolbar" aria-label="Annotation tools">
                <button type="button" @click="selectMobilePen()"
                    :class="{ 'active': drawing.isDrawingMode && drawing.currentTool === 'pen' }"
                    class="mobile-tool-chip" title="Pen" aria-label="Pen">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                    </svg>
                </button>
                <button type="button" @click="selectMobileEraser()"
                    :class="{ 'active': drawing.isDrawingMode && drawing.currentTool === 'eraser' }"
                    class="mobile-tool-chip" title="Eraser" aria-label="Eraser">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 0 1-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0M4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53l-4.95-4.95l-4.95 4.95z" />
                    </svg>
                </button>
                <button type="button" @click="selectMobilePointer()"
                    :class="{ 'active': isLaserActive && !drawing.isDrawingMode }"
                    class="mobile-tool-chip mobile-tool-chip-pointer" title="Laser pointer" aria-label="Laser pointer">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M12 1v6m0 10v6m11-7h-6m-10 0H1m15.5-6.5l-4.24 4.24M7.76 7.76L3.52 3.52m12.96 12.96l-4.24-4.24M7.76 16.24l-4.24 4.24" />
                    </svg>
                </button>
                <button type="button" @click="clearDrawings(); provideTactileFeedback()"
                    class="mobile-tool-chip mobile-tool-chip-clear" title="Clear annotations on this slide"
                    aria-label="Clear annotations">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>

            <div class="mobile-status">
                <div class="connection-indicator">
                    <span :class="{ 'disconnected': !isConnected }" id="mobileStatusIndicator">*</span>
                    <span x-text="isConnected ? 'Connected' : 'Disconnected'">Connected</span>
                </div>
                <div class="client-info">
                    <span x-text="clientCount">1</span> device(s)
                </div>
            </div>
        </div>
        </template>
    </div>

</body>

</html>
