<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Presentation Viewer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/upload/bootstrap.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
    <div class="container" x-data="uploadApp()">
        <h1>Web Presentation Viewer</h1>
        <div class="upload-section">
            <h2>Upload Your Presentation</h2>
            <form @submit.prevent="uploadFile" enctype="multipart/form-data">
                <div class="file-input-wrapper">
                    <input type="file" x-ref="fileInput" name="presentation" accept=".pdf,.zip,.md" required
                        @change="updateFileName">
                    <label for="fileInput" x-text="fileName">Choose File</label>
                </div>
                <button type="submit" :disabled="uploading">
                    <span x-show="!uploading">Upload Presentation</span>
                    <span x-show="uploading">Uploading...</span>
                </button>
            </form>
            <div x-show="status.message" x-text="status.message" :class="status.type" class="upload-status"></div>
        </div>
        <div class="supported-formats">
            <h3>Supported Formats:</h3>
            <ul>
                <li>PDF (.pdf)</li>
                <li>HacKSU slides (.zip)</li>
                <li>Markdown (.md)</li>
            </ul>
        </div>
    </div>

</body>

</html>
